name: ui-linux-arm64
# Native linux/arm64 UI build (upstream only ships linux/amd64).
# Mirrors the release_ui job's Linux steps, minus goreleaser/signing/publish.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag/branch to build (default: latest upstream release)'
        default: ''
      goarch:
        description: 'GOARCH (keep arm64)'
        default: 'arm64'
  schedule:
    # Weekly, Sunday 03:00 UTC — picks up new upstream releases automatically.
    - cron: '0 3 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # needed to create the vX.Y.Z-ui-arm64 release
    steps:
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            REF=$(gh api repos/netbirdio/netbird/releases/latest --jq .tag_name)
          fi
          echo "Upstream ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Skip if fork release already exists
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.ref }}-ui-arm64"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-arm64-ui-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-arm64-ui-

      - name: Set up Node.js
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        if: steps.skip.outputs.skip != 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install wails3 CLI (pinned to go.mod)
        if: steps.skip.outputs.skip != 'true'
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "wails3 $WAILS_VERSION"
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Generate bindings + build frontend
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd client/ui && wails3 generate bindings -clean=true -ts
          cd frontend && pnpm install --frozen-lockfile && pnpm build

      - name: Build netbird-ui (linux/arm64, production tags)
        if: steps.skip.outputs.skip != 'true'
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ inputs.goarch || 'arm64' }}
        run: |
          cd client/ui
          go build -tags production \
            -ldflags "-s -w -X github.com/netbirdio/netbird/version.version=${{ steps.ver.outputs.version }}" \
            -o netbird-ui-linux-arm64 .
          file netbird-ui-linux-arm64
          ./netbird-ui-linux-arm64 --help 2>&1 | head -20 || true
          sha256sum netbird-ui-linux-arm64

      - name: Upload artifact
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netbird-ui-linux-arm64-${{ steps.ver.outputs.version }}
          path: client/ui/netbird-ui-linux-arm64
          retention-days: 14

      - name: Publish fork release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd client/ui
          TAG="${{ steps.ver.outputs.ref }}-ui-arm64"
          gh release create "$TAG" \
            --title "netbird-ui ${{ steps.ver.outputs.version }} linux/arm64 (unofficial)" \
            --notes "Native linux/arm64 build of netbird-ui ${{ steps.ver.outputs.version }}, built from upstream tag ${{ steps.ver.outputs.ref }}. Upstream only ships linux/amd64, which crashes on 16K-page ARM systems (jemalloc)." \
            netbird-ui-linux-arm64
